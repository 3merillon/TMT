[package]
name = "tmt_terrain_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
rapier3d = "=0.35.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
